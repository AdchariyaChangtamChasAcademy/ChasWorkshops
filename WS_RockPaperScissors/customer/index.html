<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
    <h1>ROCK PAPER SCISSORS</h1>
</header>

<section class="game">
    <main class="arena">
        <article class="side">
            <h3>MAN VAL</h3>
            <p class="hand-player" id="player-hand">✊</p>
        </article>

        <hr>

        <article class="side">
            <h3>MOTS VAL</h3>
            <p class="hand-opponent" id="opponent-hand">✋</p>
        </article>
    </main>

    <section class="result">
        <p>
            <span id="player-choice">-</span> |
            <span id="opponent-choice">-</span>
        </p>
        <p id="rps-outcome">Now choose!</p>
    </section>

    <section class="controls">
        <button data-choice="rock">✊</button>
        <button data-choice="paper">✋</button>
        <button data-choice="scissors">✌️</button>
    </section>

    <aside class="ad">
        REKLAM
    </aside>
</section>

<script src="./script.js"></script>
</body>
</html>
